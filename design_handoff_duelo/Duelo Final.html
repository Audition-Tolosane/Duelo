<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1100"/>
<title>Duelo — Kit final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #E8E4DC; font-family: 'Inter', system-ui, sans-serif; color: #1a1a1a; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  @keyframes scorePop { 0% { transform: scale(1); } 40% { transform: scale(1.4); color: #32E7A3; } 100% { transform: scale(1); } }
  @keyframes heroIn { 0% { transform: scale(0.3); opacity: 0; } 60% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes ringExpand { 0% { width: 20px; height: 20px; border: 2px solid #FFB547; opacity: 1; } 100% { width: 600px; height: 600px; border: 1px solid #FFB54700; opacity: 0; } }
  @keyframes confetti { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(900px) rotate(720deg); opacity: 0.3; } }
  @keyframes pingRing { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(2.5); opacity: 0; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="tokens.js"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="screens_final.jsx"></script>
<script type="text/babel" src="proto.jsx"></script>

<script type="text/babel" data-presets="env,react">
function App() {
  const TK = window.DUELO_TOKENS;
  const SCREENS = [
    { key: 'Onboarding', C: window.F_Onboarding, note: 'Var B · mascotte conic animée' },
    { key: 'Accueil', C: window.F_Accueil, note: 'Var B + « trouve un adversaire en ~8s »' },
    { key: 'Matchmaking', C: window.F_Matchmaking, note: 'Var B · reveal VS + décompte' },
    { key: 'Quiz', C: window.F_Quiz, note: 'Var B + timer rond (de A)' },
    { key: 'Résultats', C: window.F_Results, note: 'Var B + détail des points + total' },
    { key: 'Thèmes', C: window.F_Themes, note: 'Var B vedette + grille 2 colonnes' },
    { key: 'Leaderboard', C: window.F_Leaderboard, note: 'Var B + podium (de A)' },
    { key: 'Profil', C: window.F_Profil, note: 'Var A · typo display cohérente' },
    { key: 'Shop', C: window.F_Shop, note: 'Var B · deal flash + grille' },
  ];

  return (
    <div style={{ minHeight: '100vh', background: '#E8E4DC', padding: '60px 40px 120px' }}>
      <div style={{ maxWidth: 1000, margin: '0 auto 48px' }}>
        <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: 'rgba(0,0,0,0.5)', letterSpacing: 2, textTransform: 'uppercase', marginBottom: 10 }}>◆ Kit final · variations validées</div>
        <h1 style={{ fontFamily: "'Fraunces', serif", fontStyle: 'italic', fontWeight: 400, fontSize: 64, margin: 0, letterSpacing: -2, lineHeight: 0.95, color: '#1a1a1a' }}>
          Duelo — <span style={{ color: '#6B5ACF' }}>la direction</span> retenue.
        </h1>
        <p style={{ fontFamily: 'Inter', fontSize: 16, lineHeight: 1.5, color: 'rgba(0,0,0,0.65)', maxWidth: 620, marginTop: 20 }}>
          Chaque écran assemble la variation que tu as choisie, avec tes ajustements. Le prototype en haut joue
          le flow <em>Quiz → Victoire</em> mis à jour&nbsp;: timer rond, et détail des points sur l'écran de résultats.
        </p>
      </div>

      {/* Proto */}
      <div style={{ maxWidth: 1000, margin: '0 auto 70px', padding: '40px 28px', background: '#0A0A1A', borderRadius: 28, position: 'relative', overflow: 'hidden' }}>
        <div style={{ position: 'absolute', inset: 0, background: `radial-gradient(ellipse 80% 60% at 20% 20%, ${TK.violet}30, transparent 60%), radial-gradient(ellipse 80% 60% at 80% 80%, ${TK.cyan}25, transparent 60%)` }}/>
        <div style={{ position: 'relative', display: 'flex', alignItems: 'center', gap: 50, flexWrap: 'wrap', justifyContent: 'center' }}>
          <div style={{ flex: '1 1 320px', minWidth: 300 }}>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, color: TK.gold, letterSpacing: 3, textTransform: 'uppercase', marginBottom: 12 }}>◆ Prototype · flow validé</div>
            <div style={{ fontFamily: 'Fraunces', fontStyle: 'italic', fontSize: 46, fontWeight: 400, color: '#fff', letterSpacing: -1.5, lineHeight: 1, marginBottom: 16 }}>
              Quiz → <span style={{ background: `linear-gradient(135deg, ${TK.cyan}, ${TK.violet})`, WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>Victoire</span>
            </div>
            <div style={{ fontFamily: 'Inter', fontSize: 15, color: 'rgba(255,255,255,0.7)', lineHeight: 1.55, maxWidth: 380, marginBottom: 20 }}>
              Clique une réponse. Le timer rond passe rouge sous 3s, le score poppe, transition héros, puis confettis
              et détail des points qui s'additionnent jusqu'au total.
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 9 }}>
              {[['Timer rond','glow rouge sous 3s'],['Score pop','scale + menthe'],['Transition héros','ring + serif'],['Détail XP','lignes + total animé'],['Confettis','30 particules brand']].map(f => (
                <div key={f[0]} style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
                  <div style={{ width: 6, height: 6, borderRadius: 3, background: TK.cyan, boxShadow: `0 0 8px ${TK.cyan}` }}/>
                  <div style={{ fontFamily: 'Space Grotesk', fontSize: 13, fontWeight: 700, color: '#fff' }}>{f[0]}</div>
                  <div style={{ fontFamily: 'Inter', fontSize: 12, color: 'rgba(255,255,255,0.5)' }}>· {f[1]}</div>
                </div>
              ))}
            </div>
          </div>
          <window.InteractiveProto/>
        </div>
      </div>

      {/* Screens grid */}
      <div style={{ maxWidth: 1000, margin: '0 auto' }}>
        <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: 'rgba(0,0,0,0.5)', letterSpacing: 2, textTransform: 'uppercase', marginBottom: 10 }}>◆ Les 9 écrans · version finale</div>
        <h2 style={{ fontFamily: 'Fraunces', fontStyle: 'italic', fontWeight: 400, fontSize: 38, margin: 0, letterSpacing: -1, marginBottom: 40 }}>Le kit complet</h2>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 48, justifyItems: 'center' }}>
          {SCREENS.map((s, i) => (
            <div key={s.key} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14 }}>
              <Phone label={s.note} variant={`${String(i+1).padStart(2,'0')} · ${s.key}`}><s.C/></Phone>
            </div>
          ))}
        </div>
      </div>

      <div style={{ maxWidth: 760, margin: '70px auto 0', textAlign: 'center' }}>
        <div style={{ fontFamily: 'Fraunces', fontStyle: 'italic', fontSize: 24, color: 'rgba(0,0,0,0.8)', lineHeight: 1.4, letterSpacing: -0.3 }}>
          Direction figée. Prochaine étape&nbsp;: handoff vers Claude Code pour l'intégration React Native,
          écran par écran. Dis-moi si tu veux que je régénère le paquet de handoff avec ces versions finales.
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
