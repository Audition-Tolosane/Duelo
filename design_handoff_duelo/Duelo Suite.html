<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1100"/>
<title>Duelo — Suite des écrans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Space+Grotesk:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #E8E4DC; font-family: 'Inter', system-ui, sans-serif; color: #1a1a1a; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } }
  @keyframes heroIn { 0% { transform: scale(0.3); opacity: 0; } 60% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes pingRing { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(2.2); opacity: 0; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="tokens.js"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="screens_suite1.jsx"></script>
<script type="text/babel" src="screens_suite2.jsx"></script>
<script type="text/babel" src="screens_suite3.jsx"></script>

<script type="text/babel" data-presets="env,react">
function App() {
  const TK = window.DUELO_TOKENS;
  const GROUPS = [
    { title: 'Social & joueurs', color: '#B366FF', screens: [
      { key: 'Conversations', C: window.S_Conversations, note: 'Liste des messages' },
      { key: 'Chat', C: window.S_Chat, note: 'Messagerie · interactif ✦' },
      { key: 'Recherche', C: window.S_Search, note: 'Joueurs + thèmes · interactif ✦' },
      { key: 'Notifications', C: window.S_Notifications, note: 'Défis, classement, streaks' },
      { key: 'Joueurs', C: window.S_Players, note: 'Onglet · trouver un rival' },
      { key: 'Profil joueur', C: window.S_PlayerProfile, note: 'Autre joueur · face à face' },
      { key: 'Communauté', C: window.S_Followers, note: 'Abonnés / abonnements' },
    ]},
    { title: 'Jeu & contenu', color: '#00E5FF', screens: [
      { key: 'Défi en attente', C: window.S_ChallengeWaiting, note: 'Challenge envoyé · décompte' },
      { key: 'Modes de jeu', C: window.S_Play, note: 'Onglet · quick/ami/tournoi' },
      { key: 'Tournoi', C: window.S_Tournament, note: 'Classement + récompenses' },
      { key: 'Univers', C: window.S_SuperCategory, note: 'Super-catégorie · thèmes' },
      { key: 'Détail thème', C: window.S_CategoryDetail, note: 'Stats + leaders du thème' },
      { key: 'Créer un thème', C: window.S_CreateTheme, note: 'Studio IA · interactif ✦' },
    ]},
    { title: 'Réglages', color: '#FFB547', screens: [
      { key: 'Notifications', C: window.S_NotifSettings, note: 'Toggles par catégorie' },
      { key: 'Langue', C: window.S_LanguageSettings, note: 'Sélection · interactif ✦' },
      { key: 'Aide & support', C: window.S_Support, note: 'Contact + FAQ' },
      { key: 'Conditions', C: window.S_Terms, note: 'Légal' },
    ]},
  ];
  let counter = 9;

  return (
    <div style={{ minHeight: '100vh', background: '#E8E4DC', padding: '60px 40px 120px' }}>
      <div style={{ maxWidth: 1000, margin: '0 auto 56px' }}>
        <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: 'rgba(0,0,0,0.5)', letterSpacing: 2, textTransform: 'uppercase', marginBottom: 10 }}>◆ Suite · 17 écrans · même direction</div>
        <h1 style={{ fontFamily: "'Fraunces', serif", fontStyle: 'italic', fontWeight: 400, fontSize: 60, margin: 0, letterSpacing: -2, lineHeight: 0.95, color: '#1a1a1a' }}>
          Le reste de <span style={{ color: '#6B5ACF' }}>l'app</span>, au complet.
        </h1>
        <p style={{ fontFamily: 'Inter', fontSize: 16, lineHeight: 1.5, color: 'rgba(0,0,0,0.65)', maxWidth: 600, marginTop: 20 }}>
          Les 17 écrans secondaires, dans le style validé (Space Grotesk + Fraunces + JetBrains Mono, cyan×violet,
          fond cosmique). Trois sont <strong>interactifs</strong> — Chat, Recherche et Création de thème : essaie-les directement.
        </p>
      </div>

      {GROUPS.map(g => (
        <div key={g.title} style={{ maxWidth: 1000, margin: '0 auto 64px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 32, paddingBottom: 16, borderBottom: '1px solid rgba(0,0,0,0.12)' }}>
            <div style={{ width: 10, height: 10, borderRadius: 5, background: g.color, boxShadow: `0 0 12px ${g.color}` }}/>
            <div style={{ fontFamily: 'Space Grotesk', fontWeight: 800, fontSize: 22, letterSpacing: -0.5 }}>{g.title}</div>
            <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, color: 'rgba(0,0,0,0.4)', letterSpacing: 1 }}>{g.screens.length} écrans</div>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 48, justifyItems: 'center' }}>
            {g.screens.map(s => {
              counter += 1;
              return (
                <Phone key={s.key} label={s.note} variant={`${String(counter).padStart(2,'0')} · ${s.key}`}><s.C/></Phone>
              );
            })}
          </div>
        </div>
      ))}

      <div style={{ maxWidth: 760, margin: '70px auto 0', textAlign: 'center' }}>
        <div style={{ fontFamily: 'Fraunces', fontStyle: 'italic', fontSize: 24, color: 'rgba(0,0,0,0.8)', lineHeight: 1.4, letterSpacing: -0.3 }}>
          26 écrans au total maintenant (9 principaux + 17 ici). Dis-moi si tu veux que j'intègre ces écrans
          au paquet de handoff Claude Code, ou que j'ajoute des états manquants (défaite, égalité, vide, erreurs).
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
